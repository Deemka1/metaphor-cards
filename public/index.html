<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта дня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 400px; width: 100%; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card-image {
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .card-description {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .info {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #333;
        }
        .info h2 { margin-bottom: 10px; font-size: 22px; }
        .info p { margin-bottom: 20px; color: #666; }
        .loading { color: white; text-align: center; font-size: 18px; }
        
        /* Модалка */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-bg.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 300px;
            text-align: center;
        }
        .modal-box p { margin-bottom: 20px; font-size: 16px; color: #333; }
        .modal-box button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Лоадер */
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">Загрузка...</div>
        
        <div id="noAccess" class="info" style="display:none;">
            <h2>🎴 Карта дня</h2>
            <p>Получайте одну уникальную карту каждый день.<br>50 карт — 50 дней без повторов!</p>
            <button class="btn btn-primary" onclick="watchAd()">
                📺 Посмотреть рекламу (бесплатно)
            </button>
            <button class="btn btn-secondary" onclick="subscribe()">
                 Подписка 100₽/мес (без рекламы)
            </button>
        </div>
        
        <div id="loader" class="loader"></div>
        
        <div id="cardView" class="card" style="display:none;">
            <div class="card-image">
                <img id="cardImage" src="" alt="Карта дня">
            </div>
            <h2 class="card-title" id="cardTitle"></h2>
            <p class="card-description" id="cardDescription"></p>
            <p style="color:#999; font-size:14px;" id="cardDate"></p>
        </div>
    </div>

    <!-- Модалка -->
    <div id="modal" class="modal-bg">
        <div class="modal-box">
            <p id="modalText"></p>
            <button id="modalBtn">OK</button>
        </div>
    </div>

    <script>
        console.log('[APP] Инициализация...');
        
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.ready(); console.log('[Telegram] ready'); } catch(e) { console.error('[Telegram] ready error:', e); }
            try { tg.expand(); console.log('[Telegram] expand'); } catch(e) { console.error('[Telegram] expand error:', e); }
        }
        
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? tg.initDataUnsafe.user.id 
            : 'test_user_123';
        
        console.log('[APP] userId:', userId);
        
        let modalCallback = null;
        
        function showModal(text, callback) {
            console.log('[Modal] show:', text);
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
            modalCallback = callback;
        }
        
        function closeModal() {
            console.log('[Modal] close');
            document.getElementById('modal').classList.remove('active');
            if (modalCallback) {
                const cb = modalCallback;
                modalCallback = null;
                cb();
            }
        }
        
        document.getElementById('modalBtn').addEventListener('click', closeModal);
        
        async function loadCard() {
            console.log('[APP] loadCard called');
            try {
                console.log('[API] GET /api/get-card, userId:', userId);
                const res = await fetch('/api/get-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });
                
                console.log('[API] Response status:', res.status);
                document.getElementById('loading').style.display = 'none';
                
                if (res.status === 403) {
                    console.log('[API] No access, show buttons');
                    document.getElementById('noAccess').style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                console.log('[API] Card data:', data);
                
                document.getElementById('cardView').style.display = 'block';
                document.getElementById('cardImage').src = '/images/' + data.card.image;
                document.getElementById('cardTitle').textContent = data.card.title;
                document.getElementById('cardDescription').textContent = data.card.description;
                document.getElementById('cardDate').textContent = 
                    data.alreadyReceived ? '✨ Ваша карта на сегодня' : '🎉 Новая карта!';
            } catch (e) {
                console.error('[APP] Error:', e);
                document.getElementById('loading').style.display = 'none';
                showModal('Ошибка загрузки: ' + e.message, null);
            }
        }
        
        async function watchAd() {
            console.log('[APP] watchAd called');
            showModal('Нажмите OK для получения карты.', async function() {
                console.log('[APP] Modal OK clicked, calling API');
                try {
                    document.getElementById('loader').style.display = 'block';
                    console.log('[API] POST /api/watch-ad');
                    
                    const res = await fetch('/api/watch-ad', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId })
                    });
                    
                    console.log('[API] Response status:', res.status);
                    document.getElementById('loader').style.display = 'none';
                    
                    if (!res.ok) {
                        throw new Error('Server error: ' + res.status);
                    }
                    
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    console.error('[APP] Error in watchAd:', e);
                    document.getElementById('loader').style.display = 'none';
                    showModal('Ошибка: ' + e.message, null);
                }
            });
        }
        
        async function subscribe() {
            console.log('[APP] subscribe called');
            showModal('Подписка 100₽/мес. Здесь будет переход к оплате.', async function() {
                console.log('[APP] Modal OK clicked, calling API');
                try {
                    document.getElementById('loader').style.display = 'block';
                    console.log('[API] POST /api/subscribe');
                    
                    const res = await fetch('/api/subscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId })
                    });
                    
                    console.log('[API] Response status:', res.status);
                    document.getElementById('loader').style.display = 'none';
                    
                    if (!res.ok) {
                        throw new Error('Server error: ' + res.status);
                    }
                    
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    console.error('[APP] Error in subscribe:', e);
                    document.getElementById('loader').style.display = 'none';
                    showModal('Ошибка: ' + e.message, null);
                }
            });
        }
        
        console.log('[APP] Starting loadCard');
        loadCard();
    </script>
</body>
</html>
