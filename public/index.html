<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта дня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 400px; width: 100%; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card-image {
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .card-description {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .info {
            background: rgba(255,255,255,0.95);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #333;
        }
        .info h2 { margin-bottom: 10px; font-size: 22px; }
        .info p { margin-bottom: 20px; color: #666; }
        .loading { color: white; text-align: center; font-size: 18px; }
        
        /* Модалка */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-bg.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 300px;
            text-align: center;
        }
        .modal-box p { margin-bottom: 20px; font-size: 16px; color: #333; }
        .modal-box button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">Загрузка...</div>
        
        <div id="noAccess" class="info" style="display:none;">
            <h2>🎴 Карта дня</h2>
            <p>Получайте одну уникальную карту каждый день.<br>50 карт — 50 дней без повторов!</p>
            <button class="btn btn-primary" onclick="watchAd()">
                📺 Посмотреть рекламу (бесплатно)
            </button>
            <button class="btn btn-secondary" onclick="subscribe()">
                 Подписка 100₽/мес (без рекламы)
            </button>
        </div>
        
        <div id="cardView" class="card" style="display:none;">
            <div class="card-image">
                <img id="cardImage" src="" alt="Карта дня">
            </div>
            <h2 class="card-title" id="cardTitle"></h2>
            <p class="card-description" id="cardDescription"></p>
            <p style="color:#999; font-size:14px;" id="cardDate"></p>
        </div>
    </div>

    <!-- Модалка -->
    <div id="modal" class="modal-bg">
        <div class="modal-box">
            <p id="modalText"></p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram — БЕЗ вызовов методов, которые могут не работать
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.ready(); } catch(e) {}
            try { tg.expand(); } catch(e) {}
        }
        
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? tg.initDataUnsafe.user.id 
            : 'test_user_123';
        
        function showModal(text) {
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        async function loadCard() {
            try {
                const res = await fetch('/api/get-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });
                
                document.getElementById('loading').style.display = 'none';
                
                if (res.status === 403) {
                    document.getElementById('noAccess').style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                document.getElementById('cardView').style.display = 'block';
                document.getElementById('cardImage').src = '/images/' + data.card.image;
                document.getElementById('cardTitle').textContent = data.card.title;
                document.getElementById('cardDescription').textContent = data.card.description;
                document.getElementById('cardDate').textContent = 
                    data.alreadyReceived ? '✨ Ваша карта на сегодня' : ' Новая карта!';
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                showModal('Ошибка загрузки: ' + e.message);
            }
        }
        
        async function watchAd() {
            showModal('Нажмите OK для получения карты.');
            
            // Ждём пока пользователь закроет модалку
            document.getElementById('modal').onclick = async function(e) {
                if (e.target === document.getElementById('modal') || e.target.tagName === 'BUTTON') {
                    closeModal();
                    document.getElementById('modal').onclick = null;
                    
                    try {
                        await fetch('/api/watch-ad', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId })
                        });
                        document.getElementById('noAccess').style.display = 'none';
                        loadCard();
                    } catch (e) {
                        showModal('Ошибка: ' + e.message);
                    }
                }
            };
        }
        
        async function subscribe() {
            showModal('Подписка 100₽/мес. Здесь будет переход к оплате.');
            
            document.getElementById('modal').onclick = async function(e) {
                if (e.target === document.getElementById('modal') || e.target.tagName === 'BUTTON') {
                    closeModal();
                    document.getElementById('modal').onclick = null;
                    
                    try {
                        await fetch('/api/subscribe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId })
                        });
                        document.getElementById('noAccess').style.display = 'none';
                        loadCard();
                    } catch (e) {
                        showModal('Ошибка: ' + e.message);
                    }
                }
            };
        }
        
        loadCard();
    </script>
</body>
</html>
