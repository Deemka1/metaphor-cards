<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта дня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #667eea);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 400px; width: 100%; }
        .card {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            animation: appear 0.6s ease-out;
        }
        @keyframes appear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-image {
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--tg-theme-text-color, #333);
        }
        .card-description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--tg-theme-hint-color, #555);
            margin-bottom: 20px;
        }
        .info {
            background: var(--tg-theme-secondary-bg-color, rgba(255,255,255,0.95));
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: var(--tg-theme-text-color, #333);
        }
        .info h2 { margin-bottom: 10px; font-size: 22px; }
        .info p { margin-bottom: 20px; color: var(--tg-theme-hint-color, #666); }
        .loading { 
            color: var(--tg-theme-text-color, white); 
            text-align: center; 
            font-size: 18px; 
        }
        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--tg-theme-secondary-bg-color, white);
            border-radius: 15px;
            padding: 30px;
            max-width: 300px;
            text-align: center;
            color: var(--tg-theme-text-color, #333);
        }
        .modal p { margin-bottom: 20px; font-size: 16px; }
        .modal-btn {
            background: var(--tg-theme-button-color, #667eea);
            color: var(--tg-theme-button-text-color, white);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">Загрузка...</div>
        
        <div id="noAccess" class="info" style="display:none;">
            <h2>🎴 Карта дня</h2>
            <p>Получайте одну уникальную карту каждый день.<br>50 карт — 50 дней без повторов!</p>
            <button class="btn btn-primary" onclick="watchAd()" style="width:100%; padding:15px; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:10px; background:var(--tg-theme-button-color, #667eea); color:var(--tg-theme-button-text-color, white);">
                📺 Посмотреть рекламу (бесплатно)
            </button>
            <button class="btn btn-secondary" onclick="subscribe()" style="width:100%; padding:15px; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; background:var(--tg-theme-secondary-bg-color, #f0f0f0); color:var(--tg-theme-text-color, #333);">
                💎 Подписка 100₽/мес (без рекламы)
            </button>
        </div>
        
        <div id="cardView" class="card" style="display:none;">
            <div class="card-image">
                <img id="cardImage" src="" alt="Карта дня">
            </div>
            <h2 class="card-title" id="cardTitle"></h2>
            <p class="card-description" id="cardDescription"></p>
            <p style="color:var(--tg-theme-hint-color, #999); font-size:14px;" id="cardDate"></p>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="modal-overlay">
        <div class="modal">
            <p id="modalText"></p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const userId = tg.initDataUnsafe?.user?.id || 'test_user_123';
        
        function showModal(text) {
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').style.display = 'flex';
            // Вибрация для тактильного отклика
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        async function loadCard() {
            try {
                const res = await fetch('/api/get-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                
                document.getElementById('loading').style.display = 'none';
                
                if (res.status === 403) {
                    document.getElementById('noAccess').style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                document.getElementById('cardView').style.display = 'block';
                document.getElementById('cardImage').src = '/images/' + data.card.image;
                document.getElementById('cardTitle').textContent = data.card.title;
                document.getElementById('cardDescription').textContent = data.card.description;
                document.getElementById('cardDate').textContent = 
                    data.alreadyReceived ? '✨ Ваша карта на сегодня' : '🎉 Новая карта!';
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                showModal('Ошибка загрузки: ' + e.message);
            }
        }
        
        async function watchAd() {
            showModal('Нажмите OK для получения карты.');
            
            setTimeout(async () => {
                try {
                    await fetch('/api/watch-ad', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId })
                    });
                    
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    showModal('Ошибка: ' + e.message);
                }
            }, 1000);
        }
        
        async function subscribe() {
            showModal('Подписка 100₽/мес. Здесь будет переход к оплате.');
            
            setTimeout(async () => {
                try {
                    await fetch('/api/subscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId })
                    });
                    
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    showModal('Ошибка: ' + e.message);
                }
            }, 1000);
        }
        
        loadCard();
    </script>
</body>
</html>
