<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта дня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent);
            background-size: 200% 200%;
            animation: twinkle 8s ease-in-out infinite;
            opacity: 0.6;
            z-index: 0;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        .container { 
            max-width: 400px; 
            width: 100%; 
            position: relative;
            z-index: 1;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes cardAppear {
            0% { 
                opacity: 0; 
                transform: translateY(50px) scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .card-image {
            width: 100%;
            height: 380px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 40px rgba(102, 126, 234, 0.4),
                0 0 80px rgba(118, 75, 162, 0.2);
            position: relative;
        }
        
        .card-image::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 70%
            );
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }
        
        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.5);
            letter-spacing: 0.5px;
        }
        
        .card-description {
            font-size: 15px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        .card-date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn:active { 
            transform: scale(0.96); 
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(102, 126, 234, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        
        .btn-primary:hover {
            box-shadow: 
                0 6px 25px rgba(102, 126, 234, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: translateY(-2px);
        }
        
        .btn-secondary { 
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        
        .btn-share { 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(59, 130, 246, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        
        .btn-share:hover {
            box-shadow: 
                0 6px 25px rgba(59, 130, 246, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: translateY(-2px);
        }
        
        .btn-story { 
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            color: white;
            box-shadow: 
                0 4px 20px rgba(124, 58, 237, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        
        .btn-story:hover {
            box-shadow: 
                0 6px 25px rgba(124, 58, 237, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: translateY(-2px);
        }
        
        .info {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            color: white;
            animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .info h2 { 
            margin-bottom: 15px; 
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .info p { 
            margin-bottom: 25px; 
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            line-height: 1.6;
        }
        
        .loading { 
            color: rgba(255, 255, 255, 0.6); 
            text-align: center; 
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-bg.active { display: flex; }
        
        .modal-box {
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            max-width: 320px;
            text-align: center;
            animation: modalAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.8); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }
        
        .modal-box p { 
            margin-bottom: 25px; 
            font-size: 16px; 
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            white-space: pre-line;
        }
        
        .modal-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .modal-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div id="loading" class="loading">ЗАГРУЗКА...</div>
        
        <div id="noAccess" class="info" style="display:none;">
            <h2>🎴 Карта Дня</h2>
            <p>Узнайте послание, которое подготовила для вас вселенная сегодня.<br>50 уникальных карт — 50 дней открытий.</p>
            <button class="btn btn-primary" onclick="watchAd()">
                ✨ Получить карту бесплатно
            </button>
            <button class="btn btn-secondary" onclick="subscribe()">
                💎 Подписка без рекламы
            </button>
        </div>
        
        <div id="cardView" class="card" style="display:none;">
            <div class="card-image">
                <img id="cardImage" src="" alt="Карта дня">
            </div>
            <h2 class="card-title" id="cardTitle"></h2>
            <p class="card-description" id="cardDescription"></p>
            <p class="card-date" id="cardDate"></p>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn btn-share" onclick="shareCard()">
                    <span></span>
                    <span>Поделиться с другом</span>
                </button>
                <button class="btn btn-story" onclick="shareToStory()">
                    <span>📸</span>
                    <span>Опубликовать в Истории</span>
                </button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal-bg">
        <div class="modal-box">
            <p id="modalText"></p>
            <button id="modalBtn">Продолжить</button>
        </div>
    </div>

    <script>
        const BOT_USERNAME = 'Card_of_the_days_bot';
        
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try { tg.ready(); } catch(e) {}
            try { tg.expand(); } catch(e) {}
        }
        
        const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? tg.initDataUnsafe.user.id 
            : 'test_user_123';
        
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 10 + 's';
                star.style.animationDuration = (Math.random() * 10 + 10) + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();
        
        let modalCallback = null;
        
        function showModal(text, callback) {
            document.getElementById('modalText').textContent = text;
            document.getElementById('modal').classList.add('active');
            modalCallback = callback;
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            if (modalCallback) {
                const cb = modalCallback;
                modalCallback = null;
                cb();
            }
        }
        
        document.getElementById('modalBtn').addEventListener('click', closeModal);
        
        async function loadCard() {
            try {
                const res = await fetch('/api/get-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });
                
                document.getElementById('loading').style.display = 'none';
                
                if (res.status === 403) {
                    document.getElementById('noAccess').style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                document.getElementById('cardView').style.display = 'block';
                const SUPABASE_STORAGE_URL = 'https://mmyfzresvqvluwcigxgi.supabase.co/storage/v1/object/public/cards';
document.getElementById('cardImage').src = SUPABASE_STORAGE_URL + '/' + data.card.image;
                document.getElementById('cardTitle').textContent = data.card.title;
                document.getElementById('cardDescription').textContent = data.card.description;
                document.getElementById('cardDate').textContent = 
                    data.alreadyReceived ? '✨ Ваше послание на сегодня' : '🎉 Новое послание';
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                showModal('Что-то пошло не так. Попробуйте позже.', null);
            }
        }
        
        async function watchAd() {
            showModal('Нажмите "Продолжить", чтобы получить вашу карту.', async function() {
                try {
                    const res = await fetch('/api/watch-ad', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId })
                    });
                    if (!res.ok) throw new Error('Ошибка сервера');
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    showModal('Ошибка: ' + e.message, null);
                }
            });
        }
        
        async function subscribe() {
            showModal('Подписка скоро будет доступна. Следите за обновлениями!', async function() {
                try {
                    const res = await fetch('/api/subscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId })
                    });
                    if (!res.ok) throw new Error('Ошибка сервера');
                    document.getElementById('noAccess').style.display = 'none';
                    loadCard();
                } catch (e) {
                    showModal('Ошибка: ' + e.message, null);
                }
            });
        }

        function shareCard() {
            const title = document.getElementById('cardTitle').textContent;
            const text = `Я получил карту дня: "${title}" 🎴\n\nУзнай своё послание!`;
            const url = `https://t.me/${BOT_USERNAME}`;
            const shareLink = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(shareLink);
            } else {
                window.open(shareLink, '_blank');
            }
        }

        async function shareToStory() {
    const title = document.getElementById('cardTitle').textContent;
    const imgElement = document.getElementById('cardImage');
    const imageUrl = imgElement.src;
    const text = `Моя карта дня: "${title}" 🎴`;
    const url = `https://t.me/${BOT_USERNAME}`;
    
    try {
        // Загружаем картинку
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        
        // Пробуем Web Share API (работает на Android)
        if (navigator.share && navigator.canShare) {
            try {
                const file = new File([blob], `card-${title}.jpg`, { type: 'image/jpeg' });
                
                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Карта дня',
                        text: text,
                        files: [file]
                    });
                    return;
                }
            } catch (e) {
                console.log('Web Share API error:', e);
                // Если отменили — не показываем ошибку
                if (e.name === 'AbortError') return;
            }
        }
        
        // Пробуем tg.shareToStory
        if (tg && typeof tg.shareToStory === 'function') {
            try {
                tg.shareToStory({
                    media: {
                        type: 'photo',
                        data: blob
                    },
                    text: text,
                    widget_link: {
                        url: url,
                        name: 'Карта дня'
                    }
                });
                return;
            } catch (e) {
                console.log('tg.shareToStory error:', e);
            }
        }
        
        // Если ничего не работает — показываем кнопку скачать
        showModal(
            '📥 Картинка готова!\n\n' +
            'Нажми "Скачать", чтобы сохранить на телефон.\n' +
            'Потом открой Telegram → Stories и выбери этот файл.',
            function() {
                // Скачиваем картинку
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = `card-${title}.jpg`;
                link.target = '_blank';
                link.click();
            }
        );
        
    } catch (e) {
        showModal('❌ Ошибка: ' + e.message, null);
    }
}
        
        loadCard();
    </script>
</body>
</html>
